<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Student Score</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow mx-auto" style="max-width: 650px;">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0">Add Student Score</h4>
        </div>

        <div class="card-body">
            <form th:action="@{/scores/save}" method="post">

                <div class="mb-3">
                    <label class="form-label">Student</label>
                    <select name="studentId" class="form-select" required>
                        <option value="">-- Select Student --</option>
                        <option th:each="student : ${students}"
                                th:value="${student.studentId}"
                                th:text="${student.studentCode + ' - ' + student.fullName}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Subject</label>
                    <select name="subjectId" class="form-select" required>
                        <option value="">-- Select Subject --</option>
                        <option th:each="subject : ${subjects}"
                                th:value="${subject.subjectId}"
                                th:text="${subject.subjectName}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Score 1</label>
                    <input type="number" name="score1"
                           min="0" max="10" step="0.01"
                           class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Score 2</label>
                    <input type="number" name="score2"
                           min="0" max="10" step="0.01"
                           class="form-control" required>
                </div>

                <button type="submit" class="btn btn-success">
                    Save Score
                </button>

                <a th:href="@{/students}" class="btn btn-secondary">
                    Back
                </a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
